services:
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: ci-cd-project-jenkins:latest
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

  sonarqube:
    image: sonarqube:lts-community
    ports:
      - "9000:9000"

volumes:
  jenkins_home: